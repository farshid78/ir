
name: Build Irancell Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Irancell Recorder APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # First check whether the project is already extracted.
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit || true)

          # If not found, extract the source ZIP.
          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f -iname '*IrancellRecorder*source*.zip' \
              -print -quit || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or source ZIP was not found."
              echo "Make sure the source ZIP is uploaded to the repository."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/ir-recorder-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ir-recorder-source"

            PROJECT_FILE=$(find "$RUNNER_TEMP/ir-recorder-source" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print -quit || true)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle was not found in the source ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app module build.gradle was not found."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
              -name sdkmanager -type f -print -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: irancell-recorder-debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
